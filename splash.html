<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VioChat - Memuat...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --violet-600: #7C3AED;
    --violet-500: #8B5CF6;
    --orange-500: #F97316;
    --bg-light: #F8F6FF; /* Warna dasar putih keunguan */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-light);
    /* Efek Aurora Lembut di latar belakang terang */
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.1) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(249, 115, 22, 0.08) 0%, transparent 40%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    flex-direction: column;
  }

  /* Container utama */
  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeOut 0.8s ease-in-out forwards;
    animation-delay: 2.8s;
  }

  /* Container Logo */
  .logo-container {
    width: 120px;
    height: 120px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    
    opacity: 0;
    transform: scale(0.5);
    animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  .logo-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    /* Efek cahaya ungu di belakang logo (tetap ada di mode terang) */
    filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.3));
    z-index: 2;
    border-radius: 20px;
  }

  /* Efek Cincin Cahaya di belakang logo */
  .logo-container::before {
    content: '';
    position: absolute;
    width: 160%;
    height: 160%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, transparent 60%);
    animation: glow 2s infinite alternate;
    z-index: 1;
  }

  /* Teks VioChat di bawah logo */
  .app-name {
    color: var(--violet-600); /* Warna teks diubah jadi violet agar kontras */
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-top: 20px;
    opacity: 0;
    animation: fadeInUp 0.8s ease forwards;
    animation-delay: 0.5s;
  }

  /* Teks kecil di bawah */
  .subtitle {
    color: #6B7280; /* Abu-abu gelap agar terbaca di latar terang */
    font-size: 14.5px;
    letter-spacing: 1px;
    margin-top: 5px;
    opacity: 0;
    animation: fadeInUp 0.8s ease forwards;
    animation-delay: 0.8s;
  }

  /* Loading Bar */
  .loader {
    margin-top: 30px;
    width: 60px;
    height: 3px;
    background: rgba(124, 58, 237, 0.1); /* Latar bar dipertegas */
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    opacity: 0;
    animation: fadeInUp 0.8s ease forwards;
    animation-delay: 1s;
  }

  .loader::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, var(--violet-600), var(--orange-500));
    border-radius: 3px;
    animation: loadingBar 1.2s ease-in-out infinite;
  }

  /* === KEYFRAMES ANIMASI === */
  @keyframes popIn {
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes glow {
    0% { transform: scale(0.9); opacity: 0.5; }
    100% { transform: scale(1.1); opacity: 1; }
  }

  @keyframes loadingBar {
    0% { left: -50%; }
    100% { left: 100%; }
  }

  @keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
  }

  /* === TEKS DEVELOPER === */
.developer-text {
  position: absolute;
  bottom: 20px; /* Jarak dari bawah layar */
  left: 0;
  width: 100%;
  text-align: center;
  color: #9CA3AF; /* Warna abu-abu pudar */
  font-size: 11px;
  letter-spacing: 0.5px;
  opacity: 0;
  /* Animasi muncul perlahan setelah loading bar */
  animation: fadeInUp 0.8s ease forwards;
  animation-delay: 1.5s; 
}
  
</style>
</head>
<body>

  <div class="splash-container">
    <div class="logo-container">
      <!-- Pastikan nama file logo Anda benar -->
      <img src="logo-viochat.png" alt="VioChat Logo">
    </div>
    
    <div class="app-name">VioChat</div>
    <div class="subtitle">Obrolan Keluarga Mbah Papi</div>
    
    <div class="loader"></div>
  </div>

<!-- Teks Developer -->
<div class="developer-text">Developed by: Soren Suhendro</div>

  <script>
    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
  apiKey: "AIzaSyBlXZ93MHtpowz3xPwlTLcwMiSYhI5eHAE",
  authDomain: "viochat-2528a.firebaseapp.com",
  projectId: "viochat-2528a",
  storageBucket: "viochat-2528a.firebasestorage.app",
  messagingSenderId: "296507148175",
  appId: "1:296507148175:web:933c3fd682999649726dfa",
  measurementId: "G-3B8DYF9Z96"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const SPLASH_DURATION = 3000;

  // Tunggu animasi selesai, baru cek login
  setTimeout(() => {
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'index.html';
      } else {
        window.location.href = 'vio-login.html';
      }
    });
  }, SPLASH_DURATION);
</script>
</script>
  </script>

</body>
</html>
