<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VioChat - Profil Saya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet-800: #5B21B6; --violet-600: #7C3AED; --violet-100: #EDE9FE; --violet-50: #F5F3FF;
    --orange-600: #EA580C; --orange-500: #F97316;
    --text: #1F2937; --text-muted: #6B7280; --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--violet-50); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .phone { width: 100%; max-width: 420px; height: 90vh; max-height: 800px; background: var(--white); border-radius: 32px; overflow: hidden; box-shadow: 0 25px 60px -12px rgba(91, 33, 182, 0.35); display: flex; flex-direction: column; position: relative; }
  
  .header { background: linear-gradient(135deg, var(--violet-600) 0%, var(--violet-800) 100%); padding: 20px; color: white; display: flex; align-items: center; gap: 16px; }
  .back-btn { font-size: 24px; cursor: pointer; }
  .header-title { font-size: 18px; font-weight: 600; }
  
  .content { flex: 1; padding: 24px; overflow-y: auto; }
  
  /* Foto Profil */
  .profile-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
  .profile-img-container { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--orange-500); padding: 4px; margin-bottom: 16px; position: relative; }
  .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--violet-500); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; color: white; }
  
  /* Form */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--violet-800); margin-bottom: 8px; }
  .form-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--violet-100); background: var(--violet-50); font-family: inherit; font-size: 14px; color: var(--text); outline: none; }
  .form-input:focus { border-color: var(--violet-600); }
  
  .btn-save { width: 100%; padding: 14px; border-radius: 24px; border: none; background: linear-gradient(135deg, var(--orange-500), var(--orange-600)); color: white; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3); }
  .btn-save:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div class="back-btn" onclick="window.location.href='index.html'">‹</div>
    <div class="header-title">Profil Saya</div>
  </div>

  <div class="content">
    <div class="profile-section">
      <!-- Container untuk foto -->
      <div class="profile-img-container">
        <div class="profile-img" id="avatarDisplay">U</div>
      </div>
      <p style="font-size: 12px; color: var(--text-muted); text-align: center;">Tempelkan link gambar (URL) pada kolom di bawah untuk mengganti foto profil.</p>
    </div>

    <div class="form-group">
      <label class="form-label">Nama Tampilan</label>
      <input type="text" id="inputName" class="form-input" placeholder="Masukkan nama Anda">
    </div>

    <div class="form-group">
      <label class="form-label">Nomor HP</label>
      <input type="text" id="inputPhone" class="form-input" placeholder="Nomor HP">
    </div>

    <div class="form-group">
      <label class="form-label">Link Foto Profil (URL)</label>
      <input type="url" id="inputPhotoUrl" class="form-input" placeholder="https://contoh.com/gambar.jpg">
    </div>

    <button class="btn-save" onclick="simpanProfil()">Simpan Perubahan</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // GANTI DENGAN CONFIG ANDA
  const firebaseConfig = {
    apiKey: "AIzaSyBlXZ93MHtpowz3xPwlTLcwMiSYhI5eHAE",
    authDomain: "viochat-2528a.firebaseapp.com",
    projectId: "viochat-2528a",
    storageBucket: "viochat-2528a.firebasestorage.app",
    messagingSenderId: "296507148175",
    appId: "1:296507148175:web:933c3fd682999649726dfa"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      await loadProfile();
    } else {
      window.location.href = "vio-login.html";
    }
  });

  async function loadProfile() {
    const userDocRef = doc(db, "users", currentUser.uid);
    const docSnap = await getDoc(userDocRef);

    if (docSnap.exists()) {
      const data = docSnap.data();
      
      // Isi form
      document.getElementById('inputName').value = data.displayName || '';
      document.getElementById('inputPhone').value = data.phoneNumber || '';
      document.getElementById('inputPhotoUrl').value = data.photoURL || '';

      // Tampilkan Avatar
      updateAvatarDisplay(data.displayName, data.photoURL);
    }
  }

  // Fungsi untuk mengubah tampilan avatar (Gambar atau Inisial)
  function updateAvatarDisplay(name, url) {
    const avatarEl = document.getElementById('avatarDisplay');
    if (url && url.trim() !== "") {
      avatarEl.style.background = "transparent";
      avatarEl.innerHTML = `<img src="${url}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" onerror="this.style.display='none'; this.parentElement.style.background='var(--violet-500)'; this.parentElement.innerText='${name ? name.charAt(0).toUpperCase() : 'U'}'">`;
    } else {
      avatarEl.style.background = "var(--violet-500)";
      avatarEl.innerText = name ? name.charAt(0).toUpperCase() : "U";
    }
  }

  // Simpan Perubahan
  window.simpanProfil = async () => {
    const newName = document.getElementById('inputName').value;
    const newPhone = document.getElementById('inputPhone').value;
    const newPhotoUrl = document.getElementById('inputPhotoUrl').value;

    if (!newName) {
      alert("Nama tidak boleh kosong!");
      return;
    }

    try {
      const userDocRef = doc(db, "users", currentUser.uid);
      await updateDoc(userDocRef, {
        displayName: newName,
        phoneNumber: newPhone,
        photoURL: newPhotoUrl
      });
      
      alert("Profil berhasil diperbarui!");
      window.location.href = "index.html";
    } catch (error) {
      alert("Gagal menyimpan: " + error.message);
    }
  };
</script>

</body>
</html>
