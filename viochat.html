<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VioChat - Ruang Obrolan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet-900: #4C1D95; --violet-800: #5B21B6; --violet-700: #6D28D9;
    --violet-600: #7C3AED; --violet-500: #8B5CF6; --violet-400: #A78BFA;
    --violet-100: #EDE9FE; --violet-50:  #F5F3FF;
    --orange-700: #C2410C; --orange-600: #EA580C; --orange-500: #F97316;
    --orange-400: #FB923C; --orange-100: #FFEDD5;
    --text: #1F2937; --text-muted: #6B7280; --white: #FFFFFF; --green: #4ADE80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; background: var(--violet-50);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  .phone {
    width: 100%; max-width: 420px; height: 90vh; max-height: 800px;
    background: var(--white); border-radius: 32px; overflow: hidden;
    box-shadow: 0 25px 60px -12px rgba(91, 33, 182, 0.35);
    display: flex; flex-direction: column;
  }

  /* Header */
  .chat-header {
    background: linear-gradient(135deg, var(--violet-600) 0%, var(--violet-800) 100%);
    padding: 16px 20px; color: white; display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .chat-header .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--orange-400), var(--orange-600));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-weight: 600; font-size: 16px; }
  .chat-header-status { font-size: 12px; opacity: 0.85; display: flex; align-items: center; gap: 5px; }
  .online-dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; }

  /* Area Chat */
  .chat-messages {
    flex: 1; padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--violet-50);
  }
  .date-divider {
    align-self: center; background: var(--violet-100); color: var(--violet-700);
    font-size: 11px; font-weight: 600; padding: 4px 14px; border-radius: 20px; margin: 8px 0;
  }
  .msg {
    max-width: 78%; padding: 10px 14px; font-size: 14.5px; line-height: 1.45;
    animation: pop 0.25s ease; display: flex; flex-direction: column;
  }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .msg.received {
    align-self: flex-start; background: var(--white);
    border-radius: 18px 18px 18px 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .msg.sent {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--violet-600), var(--violet-700));
    color: white; border-radius: 18px 18px 4px 18px;
  }
  .msg .time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
  .msg .sender-name { font-size: 11px; font-weight: bold; color: var(--orange-600); margin-bottom: 2px; }

  /* Input Area */
  .chat-input-area {
    padding: 12px 16px; background: var(--white); display: flex;
    align-items: center; gap: 10px; border-top: 1px solid var(--violet-100);
    flex-shrink: 0;
  }
  .input-wrapper {
    flex: 1; background: var(--violet-100); border-radius: 24px;
    display: flex; align-items: center; padding: 4px 6px 4px 16px;
  }
  .input-wrapper input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 14.5px; padding: 10px 0; color: var(--text); font-family: inherit;
  }
  .send-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, var(--orange-500), var(--orange-700));
    border: none; color: white; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
  }
  .send-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="phone">
  <div class="chat-header">
    <div class="avatar" id="chat-avatar">V</div>
    <div class="chat-header-info">
      <div class="chat-header-name">VioChat Room</div>
      <div class="chat-header-status"><span class="online-dot"></span> online</div>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <!-- Pesan akan muncul di sini -->
    <div class="date-divider">Memuat pesan...</div>
  </div>

  <div class="chat-input-area">
    <div class="input-wrapper">
      <input type="text" id="chatInput" placeholder="Ketik pesan...">
    </div>
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // --- GANTI DENGAN CONFIG ANDA ---
  const firebaseConfig = {
    apiKey: "AIzaSy...", // Sesuaikan dengan milik Anda
    authDomain: "viochat-2528a.firebaseapp.com",
    projectId: "viochat-2528a",
    storageBucket: "viochat-2528a.appspot.com",
    messagingSenderId: "296507148175",
    appId: "1:296507148175:web:abcdef"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ID Room (Sementara kita pakai 1 room publik dulu)
  const ROOM_ID = "room_utama"; 
  let currentUser = null;

  // 1. Cek apakah user sudah login
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      loadMessages(); // Tarik pesan jika sudah login
    } else {
      // Jika belum login, tendang kembali ke halaman login
      alert("Sesi berakhir. Silakan login kembali.");
      window.location.href = "vio-login.html"; // Sesuaikan dengan nama file login Anda
    }
  });

  // 2. Fungsi Memuat Pesan Real-time dari Firestore
  function loadMessages() {
    const msgContainer = document.getElementById('chat-messages');
    const q = query(collection(db, "chats", ROOM_ID, "messages"), orderBy("createdAt", "asc"));

    onSnapshot(q, (snapshot) => {
      msgContainer.innerHTML = '<div class="date-divider">Hari ini</div>'; // Reset tampilan
      
      snapshot.forEach((doc) => {
        const data = doc.data();
        const isMe = data.senderId === currentUser.uid;

        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${isMe ? 'sent' : 'received'}`;
        
        // Format Jam
        let timeStr = "Baru saja";
        if (data.createdAt) {
          const date = data.createdAt.toDate();
          timeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
        }

        // Tampilkan nama pengirim jika itu pesan orang lain
        const senderName = !isMe ? `<div class="sender-name">${data.senderEmail.split('@')[0]}</div>` : '';

        msgDiv.innerHTML = `
          ${senderName}
          <div>${data.text}</div>
          <div class="time">${timeStr}</div>
        `;
        
        msgContainer.appendChild(msgDiv);
      });

      // Scroll otomatis ke bawah
      msgContainer.scrollTop = msgContainer.scrollHeight;
    });
  }

  // 3. Fungsi Kirim Pesan ke Firestore
  window.sendMsg = async () => {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentUser) return;

    input.value = ''; // Kosongkan input

    try {
      await addDoc(collection(db, "chats", ROOM_ID, "messages"), {
        text: text,
        senderId: currentUser.uid,
        senderEmail: currentUser.email,
        createdAt: serverTimestamp() // Waktu standar server Firebase
      });
    } catch (error) {
      console.error("Error mengirim pesan: ", error);
      alert("Gagal mengirim pesan. Pastikan aturan Firestore (Rules) sudah benar.");
    }
  };

  // Kirim dengan tombol Enter
  document.getElementById('chatInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMsg();
  });
</script>

</body>
</html>
