<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VioChat - Panggilan Aktif</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet-600: #7C3AED; --violet-500: #8B5CF6; --violet-100: #EDE9FE;
    --green: #10B981; --red: #EF4444; --white: #FFFFFF;
    --bg-light: #F8F6FF; --text-dark: #1F2937; --text-muted: #6B7280; --border-light: #E5E7EB;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background-color: #F8F6FF; background-image: radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.12) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(249, 115, 22, 0.08) 0%, transparent 40%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; color: var(--text-dark); }
  .call-screen { width: 100%; max-width: 400px; height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; }
  .call-header { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
  .call-type { font-size: 13px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; font-weight: 500; }
  .timer { font-size: 48px; font-weight: 700; color: var(--violet-600); letter-spacing: -1px; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
  .status-text { font-size: 14px; color: var(--green); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulseDot 2s infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
  .caller-info { display: flex; flex-direction: column; align-items: center; margin-top: -40px; }
  .avatar-container { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; width: 140px; height: 140px; }
  .avatar { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, var(--violet-500), var(--violet-600)); display: flex; justify-content: center; align-items: center; font-size: 56px; font-weight: 700; color: white; z-index: 10; position: relative; box-shadow: 0 10px 25px rgba(124, 58, 237, 0.25); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .pulse-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--violet-100); animation: slowRipple 3s infinite ease-out; }
  .pulse-ring:nth-child(2) { animation-delay: 1.5s; }
  @keyframes slowRipple { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.8); opacity: 0; } }
  .caller-name { font-size: 28px; font-weight: 700; color: var(--text-dark); letter-spacing: -0.5px; }
  .call-actions { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 30px; margin-bottom: 20px; }
  .secondary-actions { display: flex; justify-content: center; gap: 40px; width: 100%; }
  .action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
  .btn-icon { width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 26px; color: var(--text-muted); background: var(--white); border: 2px solid var(--border-light); transition: all 0.2s ease; }
  .action-btn:active .btn-icon { transform: scale(0.9); }
  .btn-icon.active { background: var(--violet-600); color: var(--white); border-color: var(--violet-600); box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
  .btn-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .btn-end .btn-icon { width: 72px; height: 72px; background: linear-gradient(135deg, #EF4444, #B91C1C); color: white; border: none; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); font-size: 30px; transform: rotate(135deg); }
  .btn-end .btn-icon span { transform: rotate(-135deg); }
  .btn-end:active .btn-icon { transform: rotate(135deg) scale(0.9); }
  .btn-end .btn-label { color: var(--text-dark); }
</style>
</head>
<body>

<div class="call-screen">
  <div class="call-header">
    <div class="call-type">VioChat Audio Call</div>
    <div class="timer" id="timer">00:00</div>
    <div class="status-text"><span class="status-dot"></span> Terhubung</div>
  </div>

  <div class="caller-info">
    <div class="avatar-container">
      <div class="pulse-ring"></div><div class="pulse-ring"></div>
      <div class="avatar" id="other-avatar">?</div>
    </div>
    <div class="caller-name" id="other-name">Memuat...</div>
  </div>

  <div class="call-actions">
    <div class="secondary-actions">
      <div class="action-btn" onclick="toggleMute(this)">
        <div class="btn-icon">🎤</div><div class="btn-label">Mute</div>
      </div>
      <div class="action-btn" onclick="toggleButton(this)">
        <div class="btn-icon">🔊</div><div class="btn-label">Speaker</div>
      </div>
    </div>
    <div class="action-btn btn-end" onclick="endCall()">
      <div class="btn-icon"><span>📞</span></div><div class="btn-label">Akhiri Panggilan</div>
    </div>
  </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, addDoc, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBlXZ93MHtpowz3xPwlTLcwMiSYhI5eHAE",
    authDomain: "viochat-2528a.firebaseapp.com",
    projectId: "viochat-2528a",
    storageBucket: "viochat-2528a.firebasestorage.app",
    messagingSenderId: "296507148175",
    appId: "1:296507148175:web:933c3fd682999649726dfa"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Konfigurasi STUN Server Google (Gratis)
  const servers = {
    iceServers: [
      { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
    ]
  };
  let pc = new RTCPeerConnection(servers);
  let localStream = null;
  let remoteStream = null;
  const remoteAudio = document.getElementById('remote-audio');

  const urlParams = new URLSearchParams(window.location.search);
  const callId = urlParams.get('callId');
  const role = urlParams.get('role'); 
  let currentUser = null;
  let timerInterval = null;
  let seconds = 0;
  let callUnsubscribe = null;
  let signalUnsubscribe = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      
      // Timer
      timerInterval = setInterval(() => {
        seconds++;
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
      }, 1000);

      // Tampilkan Info Lawan
      try {
        const callDoc = await getDoc(doc(db, "calls", callId));
        if (callDoc.exists()) {
          const callData = callDoc.data();
          const otherId = (callData.callerId === currentUser.uid) ? callData.receiverId : callData.callerId;
          const otherDoc = await getDoc(doc(db, "users", otherId));
          if (otherDoc.exists()) {
            const otherData = otherDoc.data();
            const name = otherData.displayName || "Kontak";
            document.getElementById('other-name').innerText = name;
            document.getElementById('other-avatar').innerText = name.charAt(0).toUpperCase();
            if (otherData.photoURL) {
              document.getElementById('other-avatar').style.background = "transparent";
              document.getElementById('other-avatar').innerHTML = `<img src="${otherData.photoURL}">`;
            }
          }
        }
      } catch (e) { console.log(e); }

      // Mulai WebRTC dengan Jeda
      await startWebRTC();

      // Dengarkan jika panggilan diakhiri
      callUnsubscribe = onSnapshot(doc(db, "calls", callId), (docSnap) => {
        if (docSnap.exists() && docSnap.data().status === "ended") cleanupAndExit();
      });

    } else {
      window.location.href = "vio-login.html";
    }
  });

  async function startWebRTC() {
    try {
      // === JURUS JEDA 1 DETIK ===
      await new Promise(resolve => setTimeout(resolve, 1000));

      // 1. Minta izin mikrofon
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      
      localStream.getTracks().forEach(track => {
        pc.addTrack(track, localStream);
      });

      pc.ontrack = (event) => {
        if (!remoteStream) {
          remoteStream = new MediaStream();
          remoteAudio.srcObject = remoteStream;
        }
        remoteStream.addTrack(event.track);
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          addDoc(collection(db, "calls", callId, "signals"), {
            type: "ice",
            sender: role,
            candidate: event.candidate.toJSON()
          });
        }
      };

      if (role === 'caller') {
        const offerDescription = await pc.createOffer();
        await pc.setLocalDescription(offerDescription);
        
        await addDoc(collection(db, "calls", callId, "signals"), {
          type: "offer",
          sender: "caller",
          sdp: offerDescription.sdp,
          sdpType: offerDescription.type
        });

        // Tunggu jawaban
        const signalsQuery = query(collection(db, "calls", callId, "signals"));
        signalUnsubscribe = onSnapshot(signalsQuery, async (snapshot) => {
          for (const change of snapshot.docChanges()) {
            if (change.type === "added") {
              const data = change.doc.data();
              if (data.type === "answer" && data.sender === "receiver") {
                if (pc.signalingState !== 'stable') {
                   await pc.setRemoteDescription(new RTCSessionDescription({ type: data.sdpType, sdp: data.sdp }));
                }
              }
              if (data.type === "ice" && data.sender === "receiver") {
                try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) { console.log(e); }
              }
            }
          }
        });
      } else {
        // Receiver: Tunggu offer
        const signalsQuery = query(collection(db, "calls", callId, "signals"));
        signalUnsubscribe = onSnapshot(signalsQuery, async (snapshot) => {
          for (const change of snapshot.docChanges()) {
            if (change.type === "added") {
              const data = change.doc.data();
              if (data.type === "offer" && data.sender === "caller") {
                await pc.setRemoteDescription(new RTCSessionDescription({ type: data.sdpType, sdp: data.sdp }));
                const answerDescription = await pc.createAnswer();
                await pc.setLocalDescription(answerDescription);
                await addDoc(collection(db, "calls", callId, "signals"), {
                  type: "answer",
                  sender: "receiver",
                  sdp: answerDescription.sdp,
                  sdpType: answerDescription.type
                });
              }
              if (data.type === "ice" && data.sender === "caller") {
                try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) { console.log(e); }
              }
            }
          }
        });
      }

    } catch (error) {
      console.error("Gagal memulai WebRTC:", error);
      alert("Gagal mengakses mikrofon. Pastikan Anda memberikan izin.");
    }
  }

  let isMuted = false;
  window.toggleMute = (btn) => {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(track => { track.enabled = !isMuted; });
    const icon = btn.querySelector('.btn-icon');
    icon.classList.toggle('active', isMuted);
    icon.innerText = isMuted ? "🔇" : "🎤";
  };

  window.toggleButton = (btn) => {
    const icon = btn.querySelector('.btn-icon');
    icon.classList.toggle('active');
  };

  window.endCall = async () => {
    try { await updateDoc(doc(db, "calls", callId), { status: "ended" }); } catch (e) { console.log(e); }
    cleanupAndExit();
  };

  function cleanupAndExit() {
    if (timerInterval) clearInterval(timerInterval);
    if (callUnsubscribe) callUnsubscribe();
    if (signalUnsubscribe) signalUnsubscribe();
    if (pc) pc.close();
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    window.location.href = "index.html";
  }
</script>
</body>
</html>
