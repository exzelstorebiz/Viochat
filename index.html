<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // --- GANTI DENGAN CONFIG ANDA ---
  const firebaseConfig = {
  apiKey: "AIzaSyBlXZ93MHtpowz3xPwlTLcwMiSYhI5eHAE",
  authDomain: "viochat-2528a.firebaseapp.com",
  projectId: "viochat-2528a",
  storageBucket: "viochat-2528a.firebasestorage.app",
  messagingSenderId: "296507148175",
  appId: "1:296507148175:web:933c3fd682999649726dfa",
  measurementId: "G-3B8DYF9Z96"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.querySelector('.profile-avatar').innerText = user.email.charAt(0).toUpperCase();
      await loadChatList();
    } else {
      window.location.href = "vio-login.html";
    }
  });

  async function loadChatList() {
    const container = document.getElementById('dynamic-contacts');
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      let contacts = [];
      
      querySnapshot.forEach((doc) => {
        if (doc.id !== currentUser.uid) {
          contacts.push({ id: doc.id, ...doc.data() });
        }
      });

      document.getElementById('total-kontak').innerText = contacts.length;

      if (contacts.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px;">Belum ada kontak. Klik ikon pensil untuk mencari teman.</div>';
        return;
      }

      container.innerHTML = '';

      // Looping setiap kontak untuk mencari pesan terakhir
      for (let index = 0; index < contacts.length; index++) {
        const contact = contacts[index];
        const name = contact.email ? contact.email.split('@')[0] : 'Tanpa Nama';
        const initial = name.charAt(0).toUpperCase();
        const avatarClass = index % 2 === 0 ? 'v1' : 'v2';

        // Buat ID Room (sama persis seperti di chat.html)
        const roomId = [currentUser.uid, contact.id].sort().join("_");
        
        let lastMessage = "Ketuk untuk mulai mengobrol...";
        let lastTime = "Baru";
        let isUnread = false;

        // Cari pesan terakhir di Room tersebut
        try {
          const messagesRef = collection(db, "chats", roomId, "messages");
          // Ambil 1 pesan paling akhir
          const q = query(messagesRef, orderBy("createdAt", "desc"), limit(1));
          const msgSnapshot = await getDocs(q);

          if (!msgSnapshot.empty) {
            const lastMsgData = msgSnapshot.docs[0].data();
            lastMessage = lastMsgData.text;
            isUnread = true; // Sementara kita anggap semua chat yang ada pesannya adalah unread (untuk efek visual)
            
            // Format waktu
            if (lastMsgData.createdAt) {
              const date = lastMsgData.createdAt.toDate();
              const today = new Date();
              
              if (date.toDateString() === today.toDateString()) {
                // Jika hari ini, tampilkan jam (HH:MM)
                lastTime = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
              } else {
                // Jika kemarin atau sebelumnya, tampilkan tanggal
                lastTime = date.getDate() + '/' + (date.getMonth()+1);
              }
            }
          }
        } catch (err) {
          console.log("Gagal ambil pesan untuk:", name, err);
        }

        // Tampilkan ke layar
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.onclick = () => {
          // Karena file chat Anda bernama viochat.html, pastikan namanya sesuai
          window.location.href = `chat.html?uid=${contact.id}&name=${encodeURIComponent(name)}`;
        };
        
        div.innerHTML = `
          <div class="avatar-wrap online">
            <div class="avatar ${avatarClass}">${initial}</div>
            <div class="online-badge"></div>
          </div>
          <div class="chat-content">
            <div class="chat-top">
              <div class="chat-name ${isUnread ? 'unread' : ''}">${name}</div>
              <div class="chat-time ${isUnread ? 'unread' : ''}">${lastTime}</div>
            </div>
            <div class="chat-bottom">
              <div class="chat-preview ${isUnread ? 'unread' : ''}">${lastMessage}</div>
            </div>
          </div>
        `;
        container.appendChild(div);
      }

    } catch (error) {
      container.innerHTML = `<div style="text-align: center; padding: 20px; color: red; font-size: 14px;">Gagal memuat: ${error.message}</div>`;
    }
  }
</script>
