<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VioChat - Daftar Chat</title>
<link rel="icon" type="image/png" href="logo-viochat.png">
<link rel="apple-touch-icon" href="logo-viochat.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet-800: #5B21B6; --violet-700: #6D28D9; --violet-600: #7C3AED;
    --violet-500: #8B5CF6; --violet-100: #EDE9FE; --violet-50:  #F5F3FF;
    --orange-700: #C2410C; --orange-600: #EA580C; --orange-500: #F97316;
    --orange-400: #FB923C; --orange-100: #FFEDD5;
    --text: #1F2937; --text-muted: #6B7280; --white: #FFFFFF; --green: #4ADE80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--violet-50); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .phone { width: 100%; max-width: 420px; height: 90vh; max-height: 800px; background: var(--white); border-radius: 32px; overflow: hidden; box-shadow: 0 25px 60px -12px rgba(91, 33, 182, 0.35); display: flex; flex-direction: column; position: relative; }

  /* === CSS SPLASH SCREEN (OVERLAY) === */
  #splash-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #F8F6FF;
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.1) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(249, 115, 22, 0.08) 0%, transparent 40%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999; transition: opacity 0.5s ease;
  }
  #splash-overlay.fade-out { opacity: 0; pointer-events: none; }
  .splash-logo-container {
    width: 120px; height: 120px; display: flex; justify-content: center; align-items: center;
    opacity: 0; transform: scale(0.5); animation: splashPopIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .splash-logo-container img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.3)); border-radius: 20px; }
  .splash-logo-container::before {
    content: ''; position: absolute; width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, transparent 60%); animation: splashGlow 2s infinite alternate;
  }
  .splash-app-name { color: var(--violet-600); font-size: 28px; font-weight: 800; margin-top: 20px; opacity: 0; animation: splashFadeInUp 0.8s ease forwards; animation-delay: 0.5s; }
  .splash-subtitle { color: #6B7280; font-size: 14.5px; letter-spacing: 1px; margin-top: 5px; opacity: 0; animation: splashFadeInUp 0.8s ease forwards; animation-delay: 0.8s; }
  .splash-loader { margin-top: 30px; width: 60px; height: 3px; background: rgba(124, 58, 237, 0.1); border-radius: 3px; overflow: hidden; position: relative; opacity: 0; animation: splashFadeInUp 0.8s ease forwards; animation-delay: 1s; }
  .splash-loader::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: linear-gradient(90deg, var(--violet-600), var(--orange-500)); border-radius: 3px; animation: splashLoadingBar 1.2s ease-in-out infinite; }
  .splash-developer-text { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #9CA3AF; font-size: 11px; letter-spacing: 0.5px; opacity: 0; animation: splashFadeInUp 0.8s ease forwards; animation-delay: 1.5s; }
  @keyframes splashPopIn { to { opacity: 1; transform: scale(1); } }
  @keyframes splashFadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes splashGlow { 0% { transform: scale(0.9); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 1; } }
  @keyframes splashLoadingBar { 0% { left: -50%; } 100% { left: 100%; } }

  .app-header { background: linear-gradient(135deg, var(--violet-600) 0%, var(--violet-800) 100%); padding: 20px 20px 16px; color: white; }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .app-title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .app-title .dot { width: 10px; height: 10px; background: var(--orange-500); border-radius: 50%; }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  .profile-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--orange-400), var(--orange-600)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; border: 2px solid white; cursor: pointer; overflow: hidden; }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .search-bar { background: rgba(255,255,255,0.18); border-radius: 24px; padding: 11px 16px; display: flex; align-items: center; gap: 10px; }
  .search-bar input { flex: 1; border: none; background: transparent; outline: none; color: white; font-size: 14px; font-family: inherit; }
  .search-bar input::placeholder { color: rgba(255,255,255,0.7); }

  .tabs { display: flex; background: var(--white); padding: 0 10px; border-bottom: 1px solid var(--violet-100); }
  .tab { flex: 1; text-align: center; padding: 14px 0; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; position: relative; }
  .tab.active { color: var(--violet-700); }
  .tab.active::after { content: ''; position: absolute; bottom: 0; left: 15%; right: 15%; height: 3px; background: var(--violet-600); border-radius: 3px 3px 0 0; }
  .tab .badge { display: inline-block; background: var(--orange-500); color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }

  .chat-list { flex: 1; overflow-y: auto; background: var(--white); padding: 8px 0; }
  .section-label { padding: 10px 20px 6px; font-size: 11.5px; font-weight: 700; color: var(--violet-700); text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 6px; }
  
  .chat-item { display: flex; align-items: center; gap: 14px; padding: 12px 20px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--violet-50); }
  .chat-item:hover { background: var(--violet-50); }
  
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; color: white; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.v1 { background: linear-gradient(135deg, var(--violet-500), var(--violet-700)); }
  .avatar.v2 { background: linear-gradient(135deg, var(--orange-400), var(--orange-600)); }
  .avatar-wrap.online .avatar { box-shadow: 0 0 0 2.5px var(--white), 0 0 0 4px var(--orange-500); }
  .online-badge { position: absolute; bottom: 1px; right: 1px; width: 14px; height: 14px; background: var(--green); border: 2.5px solid var(--white); border-radius: 50%; }

  .chat-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .chat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chat-name { font-weight: 500; font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-name.unread { font-weight: 700; color: var(--violet-800); }
  .chat-time { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; }
  .chat-time.unread { color: var(--orange-600); font-weight: 600; }
  .chat-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chat-preview { font-size: 13.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; display: flex; align-items: center; gap: 4px; }
  .chat-preview.unread { color: var(--text); font-weight: 600; }
  .preview-text { overflow: hidden; text-overflow: ellipsis; }
  
  .status-check { font-size: 12px; font-weight: bold; }
  .check-read { color: var(--orange-500); }
  .check-sent { color: var(--text-muted); }

  .fab { position: absolute; bottom: 24px; right: 24px; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--orange-500), var(--orange-700)); border: none; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4); z-index: 10; transition: transform 0.2s; }
  .fab:hover { transform: scale(1.08) rotate(90deg); }
</style>
</head>
<body>

<!-- OVERLAY SPLASH SCREEN -->
<div id="splash-overlay" style="display: none;">
  <div class="splash-logo-container">
    <img src="logo-viochat.png" alt="VioChat Logo">
  </div>
  <div class="splash-app-name">VioChat</div>
  <div class="splash-subtitle">Obrolan Keluarga Mbah Papi</div>
  <div class="splash-loader"></div>
  <div class="splash-developer-text">Developed by: Soren Suhendro</div>
</div>

<div class="phone">
  <div class="app-header">
    <div class="header-top">
      <div>
        <div class="app-title"><span class="dot"></span>VioChat</div>
        <div style="font-size: 12px; font-weight: 500; opacity: 0.85; margin-left: 18px; margin-top: 2px;">Obrolan Keluarga Mbah Papi</div>
      </div>
      <div class="header-actions">
        <div class="profile-avatar" id="my-profile-avatar" onclick="window.location.href='profil.html'">U</div>
      </div>
    </div>
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" placeholder="Cari chat atau kontak...">
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-semua" onclick="switchTab('semua')">Semua <span class="badge" id="total-kontak">0</span></div>
    <div class="tab" id="tab-unread" onclick="switchTab('unread')">Belum Dibaca <span class="badge" id="total-unread" style="display:none; background:var(--violet-600);">0</span></div>
    <div class="tab">Grup</div>
  </div>

  <div class="chat-list" id="chat-list-container">
    <!-- <div class="section-label" style="margin-top: 10px;">💬 SEMUA CHAT</div> -->
    <div id="dynamic-contacts">
      <div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px;">Memuat data...</div>
    </div>
  </div>

  <button class="fab" onclick="window.location.href='kontak.html'">✎</button>
</div>

<script type="module">
  // LOGIKA SPLASH SCREEN OVERLAY
  const splashOverlay = document.getElementById('splash-overlay');
  if (!sessionStorage.getItem('splashShown')) {
    splashOverlay.style.display = 'flex';
    setTimeout(() => {
      splashOverlay.classList.add('fade-out');
      sessionStorage.setItem('splashShown', 'true');
      setTimeout(() => { splashOverlay.style.display = 'none'; }, 500);
    }, 3000);
  } else {
    splashOverlay.style.display = 'none';
  }

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyBlXZ93MHtpowz3xPwlTLcwMiSYhI5eHAE",
  authDomain: "viochat-2528a.firebaseapp.com",
  projectId: "viochat-2528a",
  storageBucket: "viochat-2528a.firebasestorage.app",
  messagingSenderId: "296507148175",
  appId: "1:296507148175:web:933c3fd682999649726dfa",
  measurementId: "G-3B8DYF9Z96"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let chatDataStore = [];
  let currentTab = 'semua'; // Variabel penanda tab aktif

  // Fungsi untuk berpindah tab
  window.switchTab = (tab) => {
    currentTab = tab;
    
    // Atur kelas active pada tab
    document.getElementById('tab-semua').classList.remove('active');
    document.getElementById('tab-unread').classList.remove('active');
    
    if (tab === 'semua') {
      document.getElementById('tab-semua').classList.add('active');
    } else if (tab === 'unread') {
      document.getElementById('tab-unread').classList.add('active');
    }
    
    // Render ulang daftar chat sesuai tab yang dipilih
    renderChatListUI();
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      
      // Tampilkan Avatar Pengguna Sendiri di Header
      try {
        const myDoc = await getDoc(doc(db, "users", user.uid));
        if (myDoc.exists()) {
          const data = myDoc.data();
          const avatarEl = document.getElementById('my-profile-avatar');
          if (data.photoURL && data.photoURL.trim() !== "") {
            avatarEl.innerHTML = `<img src="${data.photoURL}" alt="Profil">`;
            avatarEl.style.background = "transparent";
          } else {
            avatarEl.innerText = data.displayName ? data.displayName.charAt(0).toUpperCase() : 'U';
          }
        }
      } catch (e) { console.log("Gagal memuat avatar header:", e); }

      await initChatList();
    } else {
      setTimeout(() => { if (!auth.currentUser) window.location.href = "vio-login.html"; }, 1500);
    }
  });

  async function initChatList() {
    const container = document.getElementById('dynamic-contacts');
    try {
      const usersSnapshot = await getDocs(collection(db, "users"));
      let contacts = [];
      usersSnapshot.forEach((doc) => {
        if (doc.id !== currentUser.uid) {
          contacts.push({ id: doc.id, ...doc.data() });
        }
      });

      document.getElementById('total-kontak').innerText = contacts.length;

      if (contacts.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px;">Belum ada kontak terdaftar.</div>';
        return;
      }

      let summaries = {};
      try {
        const summarySnapshot = await getDocs(collection(db, "last_messages"));
        summarySnapshot.forEach(doc => { summaries[doc.id] = doc.data(); });
      } catch (e) {
        console.log("Gagal ambil ringkasan pesan:", e);
      }

      chatDataStore = [];
      contacts.forEach(contact => {
        const roomId = [currentUser.uid, contact.id].sort().join("_");
        const summary = summaries[roomId];

        let lastMessage = "Ketuk untuk mulai mengobrol...";
        let lastTimeStr = "";
        let lastTimestamp = 0;
        let isUnread = false;
        let lastMsgIsRead = true;
        let lastMsgIsMe = false;

        if (summary) {
          lastMessage = summary.text;
          lastMsgIsRead = summary.isRead;
          lastMsgIsMe = summary.senderId === currentUser.uid;
          
          if (summary.updatedAt) {
            const date = summary.updatedAt.toDate();
            lastTimestamp = date.getTime();
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
              lastTimeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
            } else {
              lastTimeStr = date.getDate() + '/' + (date.getMonth()+1);
            }
          }

          if (summary.senderId !== currentUser.uid && !summary.isRead) {
            isUnread = true;
          }
        }

        chatDataStore.push({ 
          contact, lastMessage, lastTimeStr, lastTimestamp, isUnread, lastMsgIsRead, lastMsgIsMe 
        });
      });

      renderChatListUI();

      onSnapshot(collection(db, "last_messages"), (snapshot) => {
        let needUpdate = false;
        snapshot.docChanges().forEach((change) => {
          const summaryData = change.doc.data();
          const roomIdChanged = change.doc.id;
          const index = chatDataStore.findIndex(c => [currentUser.uid, c.contact.id].sort().join("_") === roomIdChanged);
          
          if (index !== -1) {
            if (summaryData.updatedAt) {
              const date = summaryData.updatedAt.toDate();
              chatDataStore[index].lastTimestamp = date.getTime();
              const today = new Date();
              if (date.toDateString() === today.toDateString()) {
                chatDataStore[index].lastTimeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
              } else {
                chatDataStore[index].lastTimeStr = date.getDate() + '/' + (date.getMonth()+1);
              }
            }
            chatDataStore[index].lastMessage = summaryData.text;
            chatDataStore[index].lastMsgIsRead = summaryData.isRead;
            chatDataStore[index].lastMsgIsMe = summaryData.senderId === currentUser.uid;
            chatDataStore[index].isUnread = (summaryData.senderId !== currentUser.uid && !summaryData.isRead);
            needUpdate = true;
          }
        });
        if (needUpdate) renderChatListUI();
      });

    } catch (error) {
      container.innerHTML = `<div style="text-align: center; padding: 20px; color: red;">Gagal memuat: ${error.message}</div>`;
    }
  }

  // Fungsi Render yang sudah dimodifikasi dengan filter Tab
  function renderChatListUI() {
    const container = document.getElementById('dynamic-contacts');
    
    // 1. Hitung Total Unread (untuk badge di tab)
    let totalUnread = chatDataStore.filter(c => c.isUnread).length;
    const unreadBadge = document.getElementById('total-unread');
    if (totalUnread > 0) {
      unreadBadge.style.display = 'inline-block';
      unreadBadge.innerText = totalUnread;
    } else {
      unreadBadge.style.display = 'none';
    }

    // 2. FILTER DATA BERDASARKAN TAB YANG AKTIF
    let filteredData = chatDataStore;
    if (currentTab === 'unread') {
      filteredData = chatDataStore.filter(c => c.isUnread === true);
    }

    // 3. Jika tab unread kosong, tampilkan pesan teks
    if (filteredData.length === 0) {
      if (currentTab === 'unread') {
        container.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px;">Tidak ada pesan yang belum dibaca.</div>';
        return;
      } else if (chatDataStore.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px;">Belum ada kontak terdaftar.</div>';
        return;
      }
    }

    // 4. Urutkan dan Render
    filteredData.sort((a, b) => b.lastTimestamp - a.lastTimestamp);

    container.innerHTML = '';
    filteredData.forEach((data, index) => {
      const avatarClass = index % 2 === 0 ? 'v1' : 'v2';
      const name = data.contact.displayName || (data.contact.email ? data.contact.email.split('@')[0] : 'Tanpa Nama');
      
      let avatarHTML = '';
      if (data.contact.photoURL && data.contact.photoURL.trim() !== "") {
        avatarHTML = `<img src="${data.contact.photoURL}" alt="${name}">`;
      } else {
        avatarHTML = name.charAt(0).toUpperCase();
      }
      
      let checkPreviewHTML = '';
      if (data.lastMsgIsMe && data.lastTimestamp > 0) {
        checkPreviewHTML = data.lastMsgIsRead 
          ? `<span class="status-check check-read">✓✓</span>` 
          : `<span class="status-check check-sent">✓</span>`;
      }

      const div = document.createElement('div');
      div.className = 'chat-item';
      div.onclick = () => {
        window.location.href = `chat.html?uid=${data.contact.id}&name=${encodeURIComponent(name)}`;
      };
      
      div.innerHTML = `
        <div class="avatar-wrap online">
          <div class="avatar ${avatarClass}">${avatarHTML}</div>
          <div class="online-badge"></div>
        </div>
        <div class="chat-content">
          <div class="chat-top">
            <div class="chat-name ${data.isUnread ? 'unread' : ''}">${name}</div>
            <div class="chat-time ${data.isUnread ? 'unread' : ''}">${data.lastTimeStr}</div>
          </div>
          <div class="chat-bottom">
            <div class="chat-preview ${data.isUnread ? 'unread' : ''}">
              ${checkPreviewHTML}
              <span class="preview-text">${data.lastMessage}</span>
            </div>
          </div>
        </div>
      `;
      container.appendChild(div);
    });
  }
</script>

</body>
</html>
