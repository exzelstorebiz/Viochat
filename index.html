<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VioChat - Daftar Chat</title>
  <link rel="icon" type="image/png" href="logo-viochat.png">
<link rel="apple-touch-icon" href="logo-viochat.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet-800: #5B21B6; --violet-700: #6D28D9; --violet-600: #7C3AED;
    --violet-500: #8B5CF6; --violet-100: #EDE9FE; --violet-50:  #F5F3FF;
    --orange-700: #C2410C; --orange-600: #EA580C; --orange-500: #F97316;
    --orange-400: #FB923C; --orange-100: #FFEDD5;
    --text: #1F2937; --text-muted: #6B7280; --white: #FFFFFF; --green: #4ADE80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--violet-50); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .phone { width: 100%; max-width: 420px; height: 90vh; max-height: 800px; background: var(--white); border-radius: 32px; overflow: hidden; box-shadow: 0 25px 60px -12px rgba(91, 33, 182, 0.35); display: flex; flex-direction: column; position: relative; }

  .app-header { background: linear-gradient(135deg, var(--violet-600) 0%, var(--violet-800) 100%); padding: 20px 20px 16px; color: white; }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .app-title { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .app-title .dot { width: 10px; height: 10px; background: var(--orange-500); border-radius: 50%; }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  .profile-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--orange-400), var(--orange-600)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; border: 2px solid white; cursor: pointer; }

  .search-bar { background: rgba(255,255,255,0.18); border-radius: 24px; padding: 11px 16px; display: flex; align-items: center; gap: 10px; }
  .search-bar input { flex: 1; border: none; background: transparent; outline: none; color: white; font-size: 14px; font-family: inherit; }
  .search-bar input::placeholder { color: rgba(255,255,255,0.7); }

  .tabs { display: flex; background: var(--white); padding: 0 10px; border-bottom: 1px solid var(--violet-100); }
  .tab { flex: 1; text-align: center; padding: 14px 0; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; position: relative; }
  .tab.active { color: var(--violet-700); }
  .tab.active::after { content: ''; position: absolute; bottom: 0; left: 15%; right: 15%; height: 3px; background: var(--violet-600); border-radius: 3px 3px 0 0; }
  .tab .badge { display: inline-block; background: var(--orange-500); color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }

  .chat-list { flex: 1; overflow-y: auto; background: var(--white); padding: 8px 0; }
  .section-label { padding: 10px 20px 6px; font-size: 11.5px; font-weight: 700; color: var(--violet-700); text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 6px; }
  
  .chat-item { display: flex; align-items: center; gap: 14px; padding: 12px 20px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--violet-50); }
  .chat-item:hover { background: var(--violet-50); }
  
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; color: white; }
  .avatar.v1 { background: linear-gradient(135deg, var(--violet-500), var(--violet-700)); }
  .avatar.v2 { background: linear-gradient(135deg, var(--orange-400), var(--orange-600)); }
  .avatar-wrap.online .avatar { box-shadow: 0 0 0 2.5px var(--white), 0 0 0 4px var(--orange-500); }
  .online-badge { position: absolute; bottom: 1px; right: 1px; width: 14px; height: 14px; background: var(--green); border: 2.5px solid var(--white); border-radius: 50%; }

  .chat-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .chat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chat-name { font-weight: 500; font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-name.unread { font-weight: 700; color: var(--violet-800); }
  .chat-time { font-size: 11.5px; color: var(--text-muted); flex-shrink: 0; }
  .chat-time.unread { color: var(--orange-600); font-weight: 600; }
  .chat-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chat-preview { font-size: 13.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .chat-preview.unread { color: var(--text); font-weight: 600; }

  .fab { position: absolute; bottom: 24px; right: 24px; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--orange-500), var(--orange-700)); border: none; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4); z-index: 10; transition: transform 0.2s; }
  .fab:hover { transform: scale(1.08) rotate(90deg); }
</style>
</head>
<body>

<div class="phone">
  <div class="app-header">
    <div class="header-top">
      <div>
        <div class="app-title"><span class="dot"></span>VioChat</div>
        <div style="font-size: 12px; font-weight: 500; opacity: 0.85; margin-left: 18px; margin-top: 2px;">Chat Keluarga Mbah Papi</div>
      </div>
      <div class="header-actions">
        <span>📷</span>
        <div class="profile-avatar" id="header-avatar" onclick="window.location.href='profil.html'">U</div>
      </div>
    </div>
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" placeholder="Cari chat atau kontak...">
    </div>
  </div>

  <div class="tabs">
    <div class="tab active">Semua <span class="badge" id="total-kontak">0</span></div>
    <div class="tab">Belum Dibaca <span class="badge" id="total-unread" style="display:none; background:var(--violet-600);">0</span></div>
    <div class="tab">Grup</div>
  </div>

  <div class="chat-list" id="chat-list-container">
    <div class="section-label" style="margin-top: 10px;">💬 SEMUA CHAT</div>
    <div id="dynamic-contacts">
      <div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px;">Memuat data...</div>
    </div>
  </div>

  <button class="fab" onclick="window.location.href='kontak.html'">✎</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBlXZ93MHtpowz3xPwlTLcwMiSYhI5eHAE",
    authDomain: "viochat-2528a.firebaseapp.com",
    projectId: "viochat-2528a",
    storageBucket: "viochat-2528a.firebasestorage.app",
    messagingSenderId: "296507148175",
    appId: "1:296507148175:web:933c3fd682999649726dfa"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let chatDataStore = []; // Menyimpan data semua chat agar bisa di-sort ulang

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.querySelector('.profile-avatar').innerText = user.email.charAt(0).toUpperCase();
      await initChatList();
    } else {
      setTimeout(() => { if (!auth.currentUser) window.location.href = "vio-login.html"; }, 1500);
    }
  });

  async function initChatList() {
    const container = document.getElementById('dynamic-contacts');
    try {
      const usersSnapshot = await getDocs(collection(db, "users"));
      let contacts = [];
      usersSnapshot.forEach((doc) => {
        if (doc.id !== currentUser.uid) contacts.push({ id: doc.id, ...doc.data() });
      });

      document.getElementById('total-kontak').innerText = contacts.length;

      if (contacts.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px;">Belum ada kontak.</div>';
        return;
      }

      // Inisialisasi awal untuk setiap kontak
      for (const contact of contacts) {
        const roomId = [currentUser.uid, contact.id].sort().join("_");
        
        // Tarik data awal (pesan terakhir & status baca)
        const msgSnap = await getDocs(query(collection(db, "chats", roomId, "messages"), orderBy("createdAt", "desc"), limit(1)));
        const readSnap = await getDoc(doc(db, "chats", roomId, "read_status", currentUser.uid));
        
        let initialData = processRoomData(contact, roomId, msgSnap, readSnap);
        chatDataStore.push(initialData);

        // DENGARKAN PERUBAHAN PESAN SECARA REAL-TIME UNTUK ROOM INI
        const q = query(collection(db, "chats", roomId, "messages"), orderBy("createdAt", "desc"), limit(1));
        onSnapshot(q, async (snapshot) => {
          // Ambil ulang status baca untuk memastikan akurasi
          const latestReadSnap = await getDoc(doc(db, "chats", roomId, "read_status", currentUser.uid));
          const updatedData = processRoomData(contact, roomId, snapshot, latestReadSnap);
          
          // Update data di tempat penyimpanan lokal
          const index = chatDataStore.findIndex(c => c.contact.id === contact.id);
          if (index !== -1) chatDataStore[index] = updatedData;
          
          // Gambar ulang layar
          renderChatListUI();
        });
      }

      // Gambar pertama kali
      renderChatListUI();

    } catch (error) {
      container.innerHTML = `<div style="text-align: center; padding: 20px; color: red;">Gagal memuat: ${error.message}</div>`;
    }
  }

  // Fungsi pembantu untuk mengekstrak data dari snapshot
  function processRoomData(contact, roomId, msgSnapshot, readSnapshot) {
    let lastMessage = "Ketuk untuk mulai mengobrol...";
    let lastTimeStr = "";
    let lastTimestamp = 0;
    let isUnread = false;

    if (!msgSnapshot.empty) {
      const msgData = msgSnapshot.docs[0].data();
      lastMessage = msgData.text;
      
      if (msgData.createdAt) {
        const date = msgData.createdAt.toDate();
        lastTimestamp = date.getTime();
        const today = new Date();
        if (date.toDateString() === today.toDateString()) {
          lastTimeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
        } else {
          lastTimeStr = date.getDate() + '/' + (date.getMonth()+1);
        }
      }

      let lastReadTime = (readSnapshot.exists() && readSnapshot.data().lastReadAt) ? readSnapshot.data().lastReadAt.toMillis() : 0;
      if (msgData.senderId !== currentUser.uid && lastTimestamp > lastReadTime) {
        isUnread = true;
      }
    }

    return { contact, lastMessage, lastTimeStr, lastTimestamp, isUnread };
  }

  // Fungsi untuk menggambar daftar ke HTML
  function renderChatListUI() {
    const container = document.getElementById('dynamic-contacts');
    
    // 1. Urutkan berdasarkan timestamp terbaru
    chatDataStore.sort((a, b) => b.lastTimestamp - a.lastTimestamp);

    // 2. Hitung Total Belum Dibaca
    let totalUnread = chatDataStore.filter(c => c.isUnread).length;
    const unreadBadge = document.getElementById('total-unread');
    if (totalUnread > 0) {
      unreadBadge.style.display = 'inline-block';
      unreadBadge.innerText = totalUnread;
    } else {
      unreadBadge.style.display = 'none';
    }

    // 3. Render HTML
    container.innerHTML = '';
    chatDataStore.forEach((data, index) => {
      const avatarClass = index % 2 === 0 ? 'v1' : 'v2';
      const name = data.contact.email.split('@')[0];
      
      const div = document.createElement('div');
      div.className = 'chat-item';
      div.onclick = () => {
        window.location.href = `chat.html?uid=${data.contact.id}&name=${encodeURIComponent(name)}`;
      };
      
      div.innerHTML = `
        <div class="avatar-wrap online">
          <div class="avatar ${avatarClass}">${name.charAt(0).toUpperCase()}</div>
          <div class="online-badge"></div>
        </div>
        <div class="chat-content">
          <div class="chat-top">
            <div class="chat-name ${data.isUnread ? 'unread' : ''}">${name}</div>
            <div class="chat-time ${data.isUnread ? 'unread' : ''}">${data.lastTimeStr}</div>
          </div>
          <div class="chat-bottom">
            <div class="chat-preview ${data.isUnread ? 'unread' : ''}">${data.lastMessage}</div>
          </div>
        </div>
      `;
      container.appendChild(div);
    });
  }

  // Daftarkan Service Worker untuk PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js'); // Gunakan './', bukan '/'
}
  
</script>

</body>
</html>
